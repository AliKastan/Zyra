<!DOCTYPE html>

<head>

<title>Test: Breakout</title>

<body>
<script src="zyra-engine.js"></script>
<script>
ZyraEngine.init({
  "id": "brick-blitz",
  "type": "breakout",

    "primary": "#FF6B6B",
    "secondary": "#FBBF24",
    "background": "#0A0A2E",
    "backgroundAlt": "#0D0D3A"

    "lives": 3,
    "paddleWidth": 80,
    "paddleHeight": 14,
    "paddleColor": "#FF6B6B",

    "ballSpeed": 5,
    "brickCols": 8,
    "brickRows": 4

  "entityTypes": {
    "red":    { "color": "#FF6B6B" },

    { "name": "Speed Run", "subtitle": "Faster ball", "objective": { "type": "destroy", "target": 56 }, "speedMultiplier": 1.5, "timeLimit": 90, "powerUpChance": 0.15 },
    { "name": "Brick Wall", "subtitle": "The ultimate wall", "objective": { "type": "destroy", "target": 64 }, "speedMultiplier": 1.7, "powerUpChance": 0.2, "newMechanic": "dense_wall" }
