<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Zyra">
  <title>Zyra</title>
  <!-- Brown rounded square background for favicon legibility at tiny sizes -->
  <rect x="0" y="0" width="48" height="48" rx="9" fill="#000000"/>
  <!--
    Z path scaled from logo-symbol.svg (185×200) to fit in 30×32 inside 48×48.
    Scale = 32/200 = 0.16. x_offset = (48−30)/2 = 9, y_offset = (48−32)/2 = 8.
    All original points × 0.16, then shifted (+9, +8).
  -->
  <path
    d="M 9,8 L 33,8 L 39,18 L 33,27 L 24,40 L 17,27 L 23,18 L 15,18 Z"
    fill="#ffffff"
  />
</svg>
