<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyra — My Projects</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Projects Dashboard ───────────────────────────────────────────────── */

    body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

    .projects-layout {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .projects-header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(26,26,26,0.92);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .projects-header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .projects-header-brand .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .projects-header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-open-studio {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: var(--surface3);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background var(--ease), border-color var(--ease);
    }
    .btn-open-studio:hover { background: var(--surface4); border-color: var(--border-hi); }

    .btn-new-project {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 16px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--bg);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity var(--ease);
    }
    .btn-new-project:hover { opacity: 0.88; }

    /* Main content */
    .projects-main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 28px 60px;
    }

    /* Toolbar */
    .projects-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .projects-toolbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .projects-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Filter chips */
    .filter-bar {
      display: flex;
      gap: 6px;
    }

    .filter-chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 0.77rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--ease);
    }
    .filter-chip:hover { border-color: var(--border-mid); color: var(--text); }
    .filter-chip--active {
      background: var(--surface3);
      border-color: var(--border-mid);
      color: var(--text);
    }

    /* Project count */
    .projects-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    /* Project card */
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color var(--ease), transform var(--ease), box-shadow var(--ease);
      position: relative;
    }
    .project-card:hover {
      border-color: var(--border-hi);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    /* Thumbnail */
    .card-thumb {
      height: 156px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-thumb-initial {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      opacity: 0.18;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
      line-height: 1;
    }

    .card-thumb-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .card-type-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card-type-badge--2d {
      background: rgba(99,179,237,0.18);
      color: #93C5FD;
      border: 1px solid rgba(99,179,237,0.25);
    }
    .card-type-badge--3d {
      background: rgba(52,211,153,0.15);
      color: #6EE7B7;
      border: 1px solid rgba(52,211,153,0.22);
    }

    /* Status dot */
    .card-status-dot {
      position: absolute;
      bottom: 10px;
      left: 10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .card-status-dot--ready   { background: var(--success); }
    .card-status-dot--error   { background: var(--danger); }
    .card-status-dot--draft   { background: var(--text-muted); }
    .card-status-dot--generating { background: var(--warning); animation: pulse 1.2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Card info */
    .card-info {
      padding: 13px 14px 14px;
      border-top: 1px solid var(--border);
    }

    .card-name {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-time {
      font-size: 0.73rem;
      color: var(--text-muted);
    }

    /* Card hover actions */
    .card-actions {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 5px;
      opacity: 0;
      transition: opacity var(--ease);
      pointer-events: none;
    }
    .project-card:hover .card-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .card-action-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-mid);
      background: rgba(26,26,26,0.88);
      backdrop-filter: blur(8px);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--ease);
    }
    .card-action-btn:hover { background: var(--surface4); color: var(--text); }
    .card-action-btn--danger:hover { color: var(--danger); border-color: var(--danger); }

    /* Rename input overlay */
    .card-name-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 2px 6px;
      outline: none;
    }

    /* Loading state */
    .projects-loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .projects-loading-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid var(--border-mid);
      border-top-color: var(--text-dim);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    /* Empty state */
    .projects-empty {
      text-align: center;
      padding: 80px 20px;
      display: none;
    }
    .projects-empty--visible { display: block; }

    .projects-empty-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      opacity: 0.2;
    }

    .projects-empty-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .projects-empty-sub {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Delete confirm */
    .projects-delete-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      display: none;
    }
    .projects-delete-overlay--visible { display: flex; }

    .projects-delete-modal {
      background: var(--bg2);
      border: 1px solid var(--border-mid);
      border-radius: var(--radius-lg);
      padding: 28px;
      max-width: 380px;
      width: 90%;
      box-shadow: var(--shadow-lg);
    }
    .projects-delete-modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 8px; }
    .projects-delete-modal p  { font-size: 0.83rem; color: var(--text-dim); margin-bottom: 22px; }
    .projects-delete-actions  { display: flex; gap: 10px; justify-content: flex-end; }

    .btn-cancel {
      padding: 8px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-dim);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all var(--ease);
    }
    .btn-cancel:hover { border-color: var(--border-mid); color: var(--text); }

    .btn-delete-confirm {
      padding: 8px 18px;
      background: var(--danger-dim);
      border: 1px solid var(--danger);
      border-radius: var(--radius-sm);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--ease);
    }
    .btn-delete-confirm:hover { background: var(--danger); color: #fff; }

    /* Responsive */
    @media (max-width: 600px) {
      .projects-main    { padding: 20px 16px 40px; }
      .projects-header  { padding: 0 16px; }
      .projects-toolbar { flex-direction: column; align-items: flex-start; gap: 12px; }
      .projects-grid    { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
      .card-thumb       { height: 120px; }
      .card-thumb-initial { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
<div class="projects-layout">

  <!-- Header -->
  <header class="projects-header">
    <a href="/projects" class="projects-header-brand">
      <img src="logo-symbol.svg" height="24" alt="Zyra" />
      <span class="brand-name">Zyra</span>
    </a>
    <div class="projects-header-actions">
      <a href="/app" class="btn-open-studio">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        Studio
      </a>
      <button class="btn-new-project" id="btn-new-project">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New project
      </button>
    </div>
  </header>

  <!-- Main -->
  <div class="projects-main">

    <!-- Toolbar -->
    <div class="projects-toolbar">
      <div class="projects-toolbar-left">
        <h1 class="projects-title">My Projects</h1>
        <div class="filter-bar" id="filter-bar">
          <button class="filter-chip filter-chip--active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="2d">2D</button>
          <button class="filter-chip" data-filter="3d">3D</button>
        </div>
      </div>
      <span class="projects-count" id="projects-count"></span>
    </div>

    <!-- Loading -->
    <div class="projects-loading" id="projects-loading">
      <div class="projects-loading-spinner"></div>
      <div>Loading projects...</div>
    </div>

    <!-- Grid -->
    <div class="projects-grid" id="projects-grid" style="display:none;"></div>

    <!-- Empty state -->
    <div class="projects-empty" id="projects-empty">
      <svg class="projects-empty-icon" viewBox="0 0 185 200" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
        <path d="M 0,0 L 150,0 L 185,60 L 150,120 L 96,200 L 50,120 L 85,60 L 35,60 Z"/>
      </svg>
      <div class="projects-empty-title">No projects yet</div>
      <div class="projects-empty-sub">Generate your first mobile game to see it here.</div>
      <button class="btn-new-project" id="btn-new-project-empty">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Start building
      </button>
    </div>

  </div>
</div>

<!-- Delete confirmation -->
<div class="projects-delete-overlay" id="delete-overlay">
  <div class="projects-delete-modal">
    <h3>Delete project?</h3>
    <p>This will permanently delete the project and all generated files. This cannot be undone.</p>
    <div class="projects-delete-actions">
      <button class="btn-cancel" id="delete-cancel">Cancel</button>
      <button class="btn-delete-confirm" id="delete-confirm">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="projects.js"></script>
</body>
</html>
