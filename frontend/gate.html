<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyra Private Beta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="shortcut icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #000000;
      --border: rgba(255,255,255,0.10);
      --text:   #ffffff;
      --muted:  rgba(255,255,255,0.38);
      --error:  #F87171;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 600px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(200,210,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-bottom: 4px;
    }

    .tag {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 0.9375rem;
      font-family: inherit;
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, background 0.15s;
      caret-color: #ffffff;
    }
    input::placeholder { color: rgba(255,255,255,0.22); }
    input[type="password"]:focus {
      border-color: rgba(255,255,255,0.30);
      background: rgba(255,255,255,0.07);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 16px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      color: #000000;
      background: #ffffff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s, transform 0.12s;
    }
    button:hover:not(:disabled) { background: rgba(255,255,255,0.88); transform: translateY(-1px); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .error {
      font-size: 0.8125rem;
      color: var(--error);
      margin-top: 12px;
      min-height: 18px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="logo-symbol.svg" height="24" alt="Zyra" />
    Zyra
  </div>
  <div class="tag">Private Beta</div>

  <label for="code">Access code</label>
  <input type="password" id="code" placeholder="Enter access code" autocomplete="off" />
  <button id="btn" onclick="submit()">Continue</button>
  <div class="error" id="err"></div>
</div>

<script>
  // If cookie already valid, skip straight to app
  if (document.cookie.split(';').some(c => c.trim() === 'zyra_gate=granted')) {
    window.location.replace('/app');
  }

  document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submit();
  });

  async function submit() {
    const code = document.getElementById('code').value.trim();
    const btn  = document.getElementById('btn');
    const err  = document.getElementById('err');

    if (!code) return;

    btn.disabled = true;
    btn.textContent = 'Checking...';
    err.textContent = '';

    try {
      const res = await fetch('/api/gate/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code }),
      });

      if (res.ok) {
        window.location.replace('/app');
      } else {
        err.textContent = 'Invalid code';
        btn.disabled = false;
        btn.textContent = 'Continue';
        document.getElementById('code').focus();
      }
    } catch (_) {
      err.textContent = 'Connection error — try again';
      btn.disabled = false;
      btn.textContent = 'Continue';
    }
  }
</script>
</body>
</html>
