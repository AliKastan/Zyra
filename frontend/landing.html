<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zyra — Build with AI</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07070A;
      --text: #EEF0F8;
      --text-dim: rgba(238,240,248,0.55);
      --accent: #4F9EFF;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Particle canvas */
    #particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Layout */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* Navbar */
    nav {
      display: flex;
      align-items: center;
      padding: 0 2rem;
      height: 64px;
      flex-shrink: 0;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      text-decoration: none;
    }

    .nav-logo svg {
      width: 22px;
      height: 24px;
      flex-shrink: 0;
    }

    .nav-logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1.5rem 4rem;
      gap: 0;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      color: rgba(238,240,248,0.45);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    .hero-badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.7;
    }

    .headline {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 300;
      letter-spacing: -0.035em;
      line-height: 1.15;
      color: rgba(238,240,248,0.82);
      max-width: 640px;
      margin-bottom: 1.1rem;
    }

    .headline strong {
      font-weight: 600;
      color: #fff;
    }

    .subheading {
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      font-weight: 400;
      color: var(--text-dim);
      line-height: 1.6;
      max-width: 420px;
      margin-bottom: 2.5rem;
    }

    /* CTA buttons */
    .cta-group {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-signup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.75rem;
      font: 600 0.95rem/1 'Inter', sans-serif;
      color: #07070A;
      background: #EEF0F8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.18s, transform 0.12s;
      white-space: nowrap;
      min-height: 44px;
    }
    .btn-signup:hover { opacity: 0.88; }
    .btn-signup:active { transform: scale(0.97); }

    .btn-signin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      font: 500 0.95rem/1 'Inter', sans-serif;
      color: rgba(238,240,248,0.7);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      white-space: nowrap;
      min-height: 44px;
    }
    .btn-signin:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }

    /* Mobile */
    @media (max-width: 480px) {
      nav { padding: 0 1.25rem; height: 56px; }
      .hero { padding: 0 1.25rem 3rem; }
      .cta-group { flex-direction: column; width: 100%; max-width: 280px; }
      .btn-signup, .btn-signin { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="page">
  <nav>
    <a class="nav-logo" href="/">
      <svg viewBox="0 0 185 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 0,0 L 150,0 L 185,60 L 150,120 L 96,200 L 50,120 L 85,60 L 35,60 Z" fill="#ffffff"/>
      </svg>
      <span class="nav-logo-text">Zyra</span>
    </a>
  </nav>

  <main class="hero">
    <div class="hero-badge">
      <span class="hero-badge-dot"></span>
      AI App Builder
    </div>

    <h1 class="headline">Build full-stack apps<br>with <strong>Zyra</strong></h1>

    <p class="subheading">Describe what you want to build. Zyra generates the code, deploys a live preview, and gets you from idea to working app in seconds.</p>

    <div class="cta-group">
      <a class="btn-signup" href="/login?mode=signup">Get started free</a>
      <a class="btn-signin" href="/login">Sign in</a>
    </div>
  </main>
</div>

<script>
/* Particle system */
(function () {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const COUNT = 90;
  const MOUSE_RADIUS = 120;
  const RETURN_SPEED = 0.03;
  const BASE_SPEED = 0.14;

  let W, H, dpr;
  const mouse = { x: -9999, y: -9999 };
  let particles = [];
  let raf;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function makeParticle() {
    const x = rand(0, W), y = rand(0, H);
    return { ox: x, oy: y, x, y,
      vx: rand(-BASE_SPEED, BASE_SPEED),
      vy: rand(-BASE_SPEED, BASE_SPEED),
      r: rand(0.5, 1.5),
      a: rand(0.1, 0.45),
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: COUNT }, makeParticle);
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      p.ox += p.vx;
      p.oy += p.vy;
      if (p.ox < -10) p.ox = W + 10;
      else if (p.ox > W + 10) p.ox = -10;
      if (p.oy < -10) p.oy = H + 10;
      else if (p.oy > H + 10) p.oy = -10;

      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let tx = p.ox, ty = p.oy;
      if (dist < MOUSE_RADIUS && dist > 0.1) {
        const f = 1 - dist / MOUSE_RADIUS;
        tx += (dx / dist) * f * 50;
        ty += (dy / dist) * f * 50;
      }
      p.x += (tx - p.x) * RETURN_SPEED;
      p.y += (ty - p.y) * RETURN_SPEED;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,' + p.a + ')';
      ctx.fill();
    }
    raf = requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => {
    resize();
    for (const p of particles) { p.ox = rand(0, W); p.oy = rand(0, H); p.x = p.ox; p.y = p.oy; }
  });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else raf = requestAnimationFrame(tick);
  });

  init();
  raf = requestAnimationFrame(tick);
})();

/* Redirect if already signed in — load config.js → Supabase SDK → check session */
(function () {
  function loadScript(src, cb) {
    const s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () {}; // fail silently — redirect is optional
    document.head.appendChild(s);
  }

  loadScript('config.js', function () {
    const cfg = window.ZYRA_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseKey) return;
    loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js', function () {
      const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      sb.auth.getSession().then(function (res) {
        if (res.data.session) window.location.replace('/app');
      });
    });
  });
})();
</script>
</body>
</html>
